<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210">
<style>
.in{opacity:0;animation:in 1s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.6s cubic-bezier(.2,.7,.2,1) .5s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s ease-in-out .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.in,.grow,.draw{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2042"/><stop offset="1" stop-color="#11152b"/></linearGradient></defs>
<g class="in">
<rect x=".5" y=".5" width="359" height="209" rx="12" fill="url(#bg)" stroke="#2e3360"/>
<text x="24" y="36" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#c9c5f5">stats</text>
<g class="in" style="animation-delay:0.4s"><circle cx="28" cy="64" r="3" fill="#b9b4ee"/>
<text x="42" y="68" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" fill="#aab0cc">contributions this year</text>
<text x="336" y="68" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e6e9f5" text-anchor="end">162</text></g>
<g class="in" style="animation-delay:0.5800000000000001s"><circle cx="28" cy="88" r="3" fill="#8f8ae0"/>
<text x="42" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" fill="#aab0cc">commits this year</text>
<text x="336" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e6e9f5" text-anchor="end">156</text></g>
<g class="in" style="animation-delay:0.76s"><circle cx="28" cy="112" r="3" fill="#6c74c9"/>
<text x="42" y="116" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" fill="#aab0cc">pull requests</text>
<text x="336" y="116" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e6e9f5" text-anchor="end">0</text></g>
<g class="in" style="animation-delay:0.9400000000000001s"><circle cx="28" cy="136" r="3" fill="#b9b4ee"/>
<text x="42" y="140" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" fill="#aab0cc">issues</text>
<text x="336" y="140" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e6e9f5" text-anchor="end">5</text></g>
<g class="in" style="animation-delay:1.12s"><circle cx="28" cy="160" r="3" fill="#8f8ae0"/>
<text x="42" y="164" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" fill="#aab0cc">stars earned</text>
<text x="336" y="164" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#e6e9f5" text-anchor="end">1</text></g>
<g class="in" style="animation-delay:1.2999999999999998s"><circle cx="28" cy="184" r="3" fill="#6c74c9"/>
